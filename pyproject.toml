[project]
name = "g360-stock-color-consolidator"
version = "1.0.0"
description = "G360 - Stock Color Consolidator: descarga, consolida y genera reportes XLSX de stock con colores."
requires-python = ">=3.10"
dependencies = [
    "flet>=0.21.0,<0.24.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    "pandas>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "playwright>=1.60.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
